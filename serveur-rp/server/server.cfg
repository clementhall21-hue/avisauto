# ==========================================================
# Serveur RP Crime Organisé — configuration FXServer (QBCore)
# À utiliser après l'installation du template QBCore via txAdmin.
# Les secrets (clé de licence, mots de passe) restent dans .env /
# les convars txAdmin — ne JAMAIS les committer ici.
# ==========================================================

# --- Réseau ---
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# OneSync obligatoire (jusqu'à 2048 slots, requis pour les scripts modernes)
set onesync on
sv_maxclients 64

# --- Identité du serveur ---
sv_hostname "^1[FR]^7 Serveur RP Crime Organisé ^8| ^7Whitelist ^8| ^7discord.gg/XXXX"
sets sv_projectName "Serveur RP Crime Organisé"
sets sv_projectDesc "Gangs, territoires, économie souterraine. RP crime structuré, whitelist."
sets tags "rp, roleplay, francais, crime, gangs, whitelist"
sets locale "fr-FR"
sets banner_detail "https://exemple.fr/banner.png"
sets banner_connecting "https://exemple.fr/banner.png"

# --- Licence & clés (via variables d'environnement / txAdmin) ---
# sv_licenseKey : à définir dans txAdmin (jamais en clair dans ce fichier)
sv_scriptHookAllowed 0
sv_enforceGameBuild 3258

# --- Base de données (oxmysql) ---
# La chaîne de connexion vient de l'environnement :
# set mysql_connection_string "mysql://USER:PASS@127.0.0.1:3306/qbcore?charset=utf8mb4"

# --- Cœur QBCore (ordre de chargement important) ---
ensure oxmysql
ensure qb-core

# Ressources QBCore standard ([qb], [standalone], etc. — gérées par le template txAdmin)
ensure [qb]
ensure [standalone]
ensure [voice]

# --- Ressources custom (notre différenciation) ---
ensure [custom]
# [custom] contient notamment :
#   av-territories : système de territoires de gangs (script signature)

# --- Sécurité de base ---
sv_authMaxVariance 1
sv_authMinTrust 5
# Anti-cheat : ajouter FiveGuard/WaveShield ou équivalent avant l'ouverture publique
# ensure [anticheat]

# --- Permissions admin (compléter avec les identifiants license: des admins) ---
add_ace group.admin command allow
add_ace group.admin command.quit deny
# add_principal identifier.license:XXXXXXXX group.admin

# --- Divers ---
sv_scriptHookAllowed 0
set sv_endpointPrivacy true
